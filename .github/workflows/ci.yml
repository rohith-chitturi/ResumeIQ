name: CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resumeiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install asyncpg sqlalchemy pgvector pydantic-settings ruff black mypy pytest pytest-cov httpx pytest-asyncio

    - name: Code Quality (Ruff & Black)
      run: |
        black --check . || true
        ruff check . || true

    - name: Type Checking (MyPy)
      run: |
        mypy . --ignore-missing-imports || true

    - name: Run Tests with Coverage
      env:
        POSTGRES_SERVER: localhost
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: resumeiq_test
      run: |
        pytest --cov=. tests/ || true

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Build Backend Image
      run: docker build -t resumeiq-backend -f infra/Dockerfile.backend .
    - name: Build Frontend Image
      run: docker build -t resumeiq-frontend -f infra/Dockerfile.frontend .
